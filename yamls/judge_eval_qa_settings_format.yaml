# ------------------------------------
# OpenRouter settings
# ------------------------------------
openrouter: true
openrouter_api_key: "api_key"
openrouter_server_url: "https://openrouter.ai/api/v1"
openrouter_model_name: "qwen/qwen3.5-27b"

# ------------------------------------
# Local server settings
# ------------------------------------
SERVER_URL: "http://<server_ip>:<server_port>/v1"
MODEL_NAME: "Qwen3-30B-A3B-Instruct-2507"

# ------------------------------------
# Inference config
# ------------------------------------
infer_config:
  max_tokens: 2048
  temperature: 0
  top_p: 1.0
  timeout: 600
batch_size: 8

# ------------------------------------
# Judge dataset settings
# ------------------------------------
eval_qa_path: ./test_output/eval_qa/validation.jsonl
candidate_answer_path: ./test_output/eval_answers/answers.jsonl
id_key: id
question_key: question
reference_answer_key: answer
candidate_answer_key: answer

prompts:
  - judge_prompt: ./prompts/judge_eval_qa/judge_answer.md

# ------------------------------------
# Output
# ------------------------------------
output_path: ./test_output/eval_judge

# ------------------------------------
# Retry settings
# ------------------------------------
max_retries: 8
wait_seconds: 0.25
retry_jitter_seconds: 0.25
retry_max_delay: 30

# ------------------------------------
# httpx async pipeline-pool settings
# ------------------------------------
max_in_flight: 8
pipeline_batch_size: 32
max_connections: 16
max_keepalive_connections: 8
connect_timeout: 5
pool_timeout: 30
keepalive_expiry: 120
read_timeout: 180
http2: false

thinking_enabled_by_step:
  judge: false
