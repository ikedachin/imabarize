# ------------------------------------
# OpenRouter settings
# ------------------------------------
openrouter: true
openrouter_api_key: "api_key"
openrouter_server_url: "https://openrouter.ai/api/v1"
openrouter_model_name: "qwen/qwen3.5-27b"

# ------------------------------------
# Local server settings
# ------------------------------------
SERVER_URL: "http://<server_ip>:<server_port>/v1"
MODEL_NAME: "Qwen3-30B-A3B-Instruct-2507"

# ------------------------------------
# Inference config
# ------------------------------------
infer_config:
  max_tokens: 2048
  temperature: 0
  top_p: 1.0
  timeout: 600
batch_size: 8

# ------------------------------------
# RL / GRPO QA dataset settings
# ------------------------------------
source_path: ./test_output/cpt/wiki/all.jsonl
target_key: text
title_key: title
id_key: id
sample_size: 500
seed: 42

prompts:
  - question_prompt: ./prompts/create_rl_qa/rl_create_question.md
  - blind_answer_prompt: ./prompts/create_rl_qa/rl_blind_answer.md
  - grounded_answer_prompt: ./prompts/create_rl_qa/rl_grounded_answer.md
  - choices_prompt: ./prompts/create_rl_qa/rl_build_choices.md

# ------------------------------------
# Output
# ------------------------------------
output_path: ./test_output/rl_qa/wiki

# ------------------------------------
# Retry settings
# ------------------------------------
max_retries: 8
wait_seconds: 0.25
retry_jitter_seconds: 0.25
retry_max_delay: 30

# ------------------------------------
# httpx async pipeline-pool settings
# ------------------------------------
# max_in_flight はパイプライン全体で同時に OpenAI 互換 API へ投げる最大リクエスト数です。
# pipeline_batch_size は入力処理窓の目安で、ログ上 input_window_hint として表示されます。
max_in_flight: 8
pipeline_batch_size: 32
max_connections: 16
max_keepalive_connections: 8
connect_timeout: 5
pool_timeout: 30
keepalive_expiry: 120
read_timeout: 180
http2: false

# Qwen3 などの thinking 対応モデルで chat_template_kwargs.enable_thinking を step ごとに指定します。
# 未指定にするとサーバー側の既定値を使います。
thinking_enabled_by_step:
  question: false
  blind_answer: false
  grounded_answer: false
  choices: false
